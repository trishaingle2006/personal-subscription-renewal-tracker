services:
  - type: web
    name: renewly-subscription-tracker
    runtime: docker
    plan: free
    healthCheckPath: /login.php
    envVars:
      - key: APP_ENV
        value: production
      - key: SESSION_SECURE
        value: "true"
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "3306"
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false

